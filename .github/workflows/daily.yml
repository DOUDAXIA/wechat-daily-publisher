name: 每日公众号文章生成

on:
  schedule:
    # UTC 1:00 = 北京时间 9:00
    - cron: "0 1 * * *"
  workflow_dispatch:
    # 允许手动触发

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 写入配置文件
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: echo "$CONFIG_JSON" > config.json

      - name: 运行主程序
        run: python main.py
