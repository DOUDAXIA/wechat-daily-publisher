name: Daily Article Generator

on:
  schedule:
    - cron: "0 * * * *"
    - cron: "30 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [daily-publish]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Write Config
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: echo "$CONFIG_JSON" > config.json

      - name: Run Main Script
        id: run
        run: python main.py
        continue-on-error: true

      - name: Commit Dedup Marker
        if: always()
        run: |
          git config user.name "DailyPublisher"
          git config user.email "daily@publisher"
          TODAY=$(date -u +%Y%m%d)
          if [ -f "mao_data/${TODAY}_sent.txt" ]; then
            git add "mao_data/${TODAY}_sent.txt"
            git commit -m "标记今日已发送: ${TODAY}" || echo "nothing to commit"
            git push || echo "push failed"
          fi

      - name: Upload History Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: articles-${{ github.run_id }}
          path: history/

      - name: Failure Notification
        if: steps.run.outcome == 'failure'
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          TOKEN=$(python3 -c "import sys,json; d=json.loads(sys.argv[1]); print(d['wechat_notify']['token'])" "$CONFIG_JSON")
          curl -k -s -X POST https://www.pushplus.plus/send \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"$TOKEN\",\"title\":\"❌ 公众号文章生成失败\",\"content\":\"今日文章生成失败，请前往 GitHub Actions 查看日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
