name: Daily Article Generator

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Write Config
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: echo "$CONFIG_JSON" > config.json

      - name: Run Main Script
        run: python main.py

      - name: Upload History Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: articles-${{ github.run_id }}
          path: history/

      - name: Failure Notification
        if: failure()
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          TOKEN=$(python3 -c "import sys,json; d=json.loads(sys.argv[1]); print(d['wechat_notify']['token'])" "$CONFIG_JSON")
          curl -k -s -X POST https://www.pushplus.plus/send \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"$TOKEN\",\"title\":\"❌ 公众号文章生成失败\",\"content\":\"今日文章生成失败，请前往 GitHub Actions 查看日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          echo "[通知] 已推送失败提醒到微信"
